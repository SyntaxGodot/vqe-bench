[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vqe-bench"
version = "0.1.0"
description = "Variational Quantum Eigensolver Benchmark Suite"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nidhal Zitouni" }]
dependencies = [
    "qiskit>=1.3,<2.0",
    "qiskit-aer>=0.14",
    "numpy>=1.24",
    "scipy>=1.11",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
chemistry = ["qiskit-nature>=0.7,<0.8", "pyscf>=2.4"]
mitiq = ["mitiq>=0.40"]
docs = ["sphinx>=7.0", "sphinx-rtd-theme>=2.0", "myst-parser>=2.0"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "jupyter>=1.0",
    "ipykernel>=6.29",
]

[project.scripts]
vqe-bench = "vqe_bench.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=vqe_bench --cov-report=term-missing"
markers = ["slow: long-running benchmarks"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true