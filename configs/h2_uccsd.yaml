experiment:
  name: "h2_uccsd_sto3g"
  seed: 42
  output_dir: "results/h2_uccsd"

system:
  type: molecule
  molecule:
    name: "H2"
    basis: "sto-3g"
    geometry: [["H", [0.0, 0.0, 0.0]], ["H", [0.0, 0.0, 0.735]]]
    charge: 0
    multiplicity: 1
    mapping: parity
    tapering: true

ansatz:
  type: uccsd

optimizer:
  method: cobyla
  maxiter: 500
  num_restarts: 5

backend:
  type: aer_statevector
  noise: null

mitigation: null